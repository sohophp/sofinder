name: Package CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  PHP_BIN: php

jobs:
  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            symfony: '7'
            preference: --prefer-lowest
          - php: '8.3'
            laravel: '12'
            symfony: '7'
            preference: --prefer-stable
          - php: '8.4'
            laravel: '12'
            symfony: '7'
            preference: --prefer-stable
          - php: '8.5'
            laravel: '12'
            symfony: '7'
            preference: --prefer-stable
          - php: '8.3'
            laravel: '13'
            symfony: '7'
            preference: --prefer-lowest
          - php: '8.4'
            laravel: '13'
            symfony: '8'
            preference: --prefer-stable
          - php: '8.5'
            laravel: '13'
            symfony: '8'
            preference: --prefer-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Select synchronized root version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "COMPOSER_ROOT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'COMPOSER_ROOT_VERSION=dev-main' >> "$GITHUB_ENV"
          fi
      - run: ./scripts/composer.sh validate --strict
      - name: Configure synchronized package sources
        run: |
          ./scripts/composer.sh config minimum-stability dev
          ./scripts/composer.sh config prefer-stable true
          ./scripts/composer.sh config repositories.http '{"type":"vcs","url":"https://github.com/sohophp/sofinder-http.git"}'
      - name: Select Laravel line
        run: >-
          ./scripts/composer.sh require --no-update
          illuminate/auth:${{ matrix.laravel }}.*
          illuminate/console:${{ matrix.laravel }}.*
          illuminate/http:${{ matrix.laravel }}.*
          illuminate/routing:${{ matrix.laravel }}.*
          illuminate/session:${{ matrix.laravel }}.*
          illuminate/support:${{ matrix.laravel }}.*
      - run: ./scripts/composer.sh update --no-interaction --prefer-dist ${{ matrix.preference }}
      - run: ./scripts/composer.sh audit
      - run: find src config -type f -name '*.php' -print0 | xargs -0 -n1 ./scripts/php-bin.sh -l
      - run: >-
          ./scripts/php-bin.sh -r
          'require "vendor/autoload.php"; exit(class_exists("SohoPHP\\SoFinder\\Laravel\\SoFinderServiceProvider") ? 0 : 1);'
      - name: Verify resolved Laravel and Symfony interop lines
        run: >-
          ./scripts/php-bin.sh -r
          '$major=static function(string $package):string{$version=Composer\InstalledVersions::getPrettyVersion($package);return is_string($version)?explode(".",ltrim($version,"v"),2)[0]:"";};
          exit([$major("illuminate/support"),$major("symfony/http-foundation"),$major("symfony/psr-http-message-bridge")]
          === ["${{ matrix.laravel }}","${{ matrix.symfony }}","${{ matrix.symfony }}"] ? 0 : 1);'
