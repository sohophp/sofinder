name: Release

env:
  PHP_BIN: php

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: gd, imagick, pdo_sqlite, zip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build && pnpm check:size && pnpm test:unit
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - run: ./scripts/php-bin.sh vendor/bin/phpunit && ./scripts/php-bin.sh vendor/bin/phpstan analyse --no-progress
      - run: git diff --exit-code -- dist
      - name: Create immutable source archive and checksum
        run: |
          version=${GITHUB_REF_NAME#v}
          git archive --format=tar.gz --prefix="SoFinder-${version}/" --output="SoFinder-${version}.tar.gz" "$GITHUB_SHA"
          sha256sum "SoFinder-${version}.tar.gz" > SHA256SUMS
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sofinder-sbom.cdx.json
          artifact-name: sofinder-sbom.cdx.json
          upload-release-assets: false
          syft-version: v1.33.0
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: SoFinder-*.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofinder-release-evidence
          path: |
            SoFinder-*.tar.gz
            SHA256SUMS
            sofinder-sbom.cdx.json
      - name: Create beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" SoFinder-*.tar.gz SHA256SUMS sofinder-sbom.cdx.json --verify-tag --prerelease --generate-notes --title "$GITHUB_REF_NAME"
