name: Release

env:
  PHP_BIN: php
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to recover
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && github.event.repository.default_branch || github.ref }}
      - name: Verify annotated immutable release tag
        run: |
          test "$RELEASE_TAG" != main
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          release_sha=$(git rev-list -n 1 "$RELEASE_TAG")
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            unexpected_changes=$(git diff --name-only "$release_sha" HEAD -- . \
              ':(exclude).github/workflows/release.yml' \
              ':(exclude)scripts/prepare-package-splits.sh')
            test -z "$unexpected_changes"
          else
            test "$release_sha" = "$(git rev-parse HEAD)"
          fi
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: gd, imagick, pdo_sqlite, zip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: cp composer-7.4.json composer.json
        working-directory: examples/symfony
      - run: ../../scripts/composer.sh install --no-interaction --prefer-dist
        working-directory: examples/symfony
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build && pnpm check:size && pnpm test:unit
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - run: ./scripts/php-bin.sh vendor/bin/phpunit --display-deprecations --fail-on-deprecation && ./scripts/php-bin.sh vendor/bin/phpstan analyse --no-progress
      - run: bash scripts/check-symfony-example-http.sh
      - run: pnpm exec playwright test --config playwright.symfony.config.ts
        working-directory: frontend
      - run: bash scripts/check-package-install.sh
      - run: ./scripts/php-bin.sh scripts/check-framework-release-gate.php
      - run: pnpm install --frozen-lockfile && pnpm check
        working-directory: docs
      - run: git diff --exit-code -- dist
      - run: diff -qr dist packages/sofinder-symfony/dist
      - name: Create synchronized immutable package archives and checksums
        run: |
          version=${RELEASE_TAG#v}
          bash scripts/build-release-archives.sh "$version" "$RELEASE_SHA" release-artifacts
          bash scripts/prepare-package-splits.sh "$version" "$RELEASE_SHA" package-splits
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-artifacts/sofinder-sbom.cdx.json
          artifact-name: sofinder-sbom.cdx.json
          upload-release-assets: false
          syft-version: v1.33.0
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*.tar.gz
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sofinder-release-evidence
          path: |
            release-artifacts/
            package-splits/
      - name: Publish synchronized package repositories
        env:
          GH_TOKEN: ${{ secrets.SOFINDER_PACKAGE_PUSH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          bash scripts/publish-package-splits.sh package-splits
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_type=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then release_type=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-artifacts/* --verify-tag "${release_type[@]}" --generate-notes --title "$RELEASE_TAG"
