name: Storage provider compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1'

permissions:
  contents: read

env:
  PHP_BIN: php

jobs:
  minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: ../../scripts/composer.sh config repositories.sofinder-core '{"type":"path","url":"../sofinder-core","options":{"versions":{"sohophp/sofinder-core":"dev-main"}}}'
        working-directory: packages/sofinder-s3
      - run: ../../scripts/composer.sh update --no-interaction --prefer-dist
        working-directory: packages/sofinder-s3
      - run: docker run -d --name sofinder-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0 server /data
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - run: ../../scripts/php-bin.sh vendor/bin/phpunit tests/S3ProviderContractTest.php
        working-directory: packages/sofinder-s3
        env:
          SOFINDER_S3_CONTRACT_PROVIDER: minio
          SOFINDER_S3_ENDPOINT: http://127.0.0.1:9000
          SOFINDER_S3_BUCKET: sofinder-test
          SOFINDER_S3_REGION: us-east-1
          SOFINDER_S3_ACCESS_KEY: minioadmin
          SOFINDER_S3_SECRET_KEY: minioadmin
          SOFINDER_S3_PATH_STYLE: 'true'
          SOFINDER_S3_CREATE_BUCKET: 'true'
      - if: always()
        run: docker rm -f sofinder-minio

  configured-providers:
    runs-on: ubuntu-latest
    outputs:
      aws: ${{ steps.detect.outputs.aws }}
      r2: ${{ steps.detect.outputs.r2 }}
      backblaze: ${{ steps.detect.outputs.backblaze }}
    steps:
      - id: detect
        env:
          AWS_ACCESS: ${{ secrets.SOFINDER_AWS_ACCESS_KEY }}
          AWS_SECRET: ${{ secrets.SOFINDER_AWS_SECRET_KEY }}
          AWS_BUCKET: ${{ secrets.SOFINDER_AWS_BUCKET }}
          R2_ACCESS: ${{ secrets.SOFINDER_R2_ACCESS_KEY }}
          R2_SECRET: ${{ secrets.SOFINDER_R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.SOFINDER_R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.SOFINDER_R2_ENDPOINT }}
          B2_ACCESS: ${{ secrets.SOFINDER_B2_ACCESS_KEY }}
          B2_SECRET: ${{ secrets.SOFINDER_B2_SECRET_KEY }}
          B2_BUCKET: ${{ secrets.SOFINDER_B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.SOFINDER_B2_ENDPOINT }}
        run: |
          [[ -n "$AWS_ACCESS" && -n "$AWS_SECRET" && -n "$AWS_BUCKET" ]] && echo 'aws=true' >> "$GITHUB_OUTPUT" || echo 'aws=false' >> "$GITHUB_OUTPUT"
          [[ -n "$R2_ACCESS" && -n "$R2_SECRET" && -n "$R2_BUCKET" && -n "$R2_ENDPOINT" ]] && echo 'r2=true' >> "$GITHUB_OUTPUT" || echo 'r2=false' >> "$GITHUB_OUTPUT"
          [[ -n "$B2_ACCESS" && -n "$B2_SECRET" && -n "$B2_BUCKET" && -n "$B2_ENDPOINT" ]] && echo 'backblaze=true' >> "$GITHUB_OUTPUT" || echo 'backblaze=false' >> "$GITHUB_OUTPUT"

  aws:
    needs: configured-providers
    if: needs.configured-providers.outputs.aws == 'true'
    uses: ./.github/workflows/storage-provider-contract.yml
    secrets:
      access_key: ${{ secrets.SOFINDER_AWS_ACCESS_KEY }}
      secret_key: ${{ secrets.SOFINDER_AWS_SECRET_KEY }}
      bucket: ${{ secrets.SOFINDER_AWS_BUCKET }}
    with:
      provider: aws
      region: ${{ vars.SOFINDER_AWS_REGION || 'us-east-1' }}

  r2:
    needs: configured-providers
    if: needs.configured-providers.outputs.r2 == 'true'
    uses: ./.github/workflows/storage-provider-contract.yml
    secrets:
      access_key: ${{ secrets.SOFINDER_R2_ACCESS_KEY }}
      secret_key: ${{ secrets.SOFINDER_R2_SECRET_KEY }}
      bucket: ${{ secrets.SOFINDER_R2_BUCKET }}
      endpoint: ${{ secrets.SOFINDER_R2_ENDPOINT }}
    with:
      provider: r2
      region: auto

  backblaze:
    needs: configured-providers
    if: needs.configured-providers.outputs.backblaze == 'true'
    uses: ./.github/workflows/storage-provider-contract.yml
    secrets:
      access_key: ${{ secrets.SOFINDER_B2_ACCESS_KEY }}
      secret_key: ${{ secrets.SOFINDER_B2_SECRET_KEY }}
      bucket: ${{ secrets.SOFINDER_B2_BUCKET }}
      endpoint: ${{ secrets.SOFINDER_B2_ENDPOINT }}
    with:
      provider: backblaze
      region: ${{ vars.SOFINDER_B2_REGION || 'us-west-004' }}
