name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4.*', '7.4.*']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: composer validate --strict
      - run: |
          composer require --no-update \
            symfony/config:${{ matrix.symfony }} symfony/console:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} symfony/event-dispatcher:${{ matrix.symfony }} \
            symfony/filesystem:${{ matrix.symfony }} symfony/http-foundation:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }} symfony/routing:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }} symfony/security-csrf:${{ matrix.symfony }}
          composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: composer audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test:unit
        working-directory: frontend
      - run: git diff --exit-code -- dist
      - run: pnpm exec playwright install --with-deps
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend

  s3-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer config repositories.sofinder '{"type":"path","url":"../..","options":{"versions":{"sohophp/sofinder":"0.1.0-beta.9"}}}'
        working-directory: packages/sofinder-s3
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/sofinder-s3
      - run: docker run -d --name sofinder-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - run: vendor/bin/phpunit
        working-directory: packages/sofinder-s3
        env:
          SOFINDER_S3_ENDPOINT: http://127.0.0.1:9000
          SOFINDER_S3_BUCKET: sofinder-test
          SOFINDER_S3_ACCESS_KEY: minioadmin
          SOFINDER_S3_SECRET_KEY: minioadmin

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: gd, imagick
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan
      - run: vendor/bin/phpunit --coverage-clover var/coverage.xml

  symfony-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            manifest: composer-6.4.json
          - php: '8.5'
            manifest: composer-7.4.json
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: cp ${{ matrix.manifest }} composer.json
        working-directory: examples/symfony
      - run: composer install --no-interaction --prefer-dist
        working-directory: examples/symfony
      - run: php bin/console cache:warmup --env=prod --no-interaction
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: php bin/console sofinder:image:capabilities --env=prod --json
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: php bin/console sofinder:security:audit --env=prod
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }

  originality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan product source and distribution
        run: '! grep -RniE "CKFinder|CKSource" src frontend/src dist'
      - run: git diff --check
