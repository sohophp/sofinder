name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4.*', '7.4.*']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: composer validate --strict
      - run: |
          composer require --no-update \
            symfony/config:${{ matrix.symfony }} symfony/console:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} symfony/event-dispatcher:${{ matrix.symfony }} \
            symfony/filesystem:${{ matrix.symfony }} symfony/http-foundation:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }} symfony/routing:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }} symfony/security-csrf:${{ matrix.symfony }}
          composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit
      - run: composer audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm check:size
        working-directory: frontend
      - run: pnpm test:unit
        working-directory: frontend
      - run: git diff --exit-code -- dist
      - run: pnpm exec playwright install --with-deps
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend

  s3-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer config repositories.sofinder '{"type":"path","url":"../..","options":{"versions":{"sohophp/sofinder":"0.1.0-beta.18"}}}'
        working-directory: packages/sofinder-s3
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/sofinder-s3
      - run: docker run -d --name sofinder-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0 server /data
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - run: vendor/bin/phpunit
        working-directory: packages/sofinder-s3
        env:
          SOFINDER_S3_ENDPOINT: http://127.0.0.1:9000
          SOFINDER_S3_BUCKET: sofinder-test
          SOFINDER_S3_ACCESS_KEY: minioadmin
          SOFINDER_S3_SECRET_KEY: minioadmin

  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: gd, imagick, pcntl, pdo_sqlite, redis
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpstan
      - run: vendor/bin/phpunit --coverage-clover var/coverage.xml
      - run: >-
          php scripts/check-coverage.php var/coverage.xml 72
          src/Preview/DocumentPreviewJobManager.php:85
          src/Preview/DocumentPreviewManager.php:85
          src/Security/MalwareScanStatusStore.php:85
          src/Security/SharedMalwareScanStatusStore.php:85
          src/Http/AssetController.php:85

  pdo-state:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sofinder
          MYSQL_USER: sofinder
          MYSQL_PASSWORD: sofinder
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usofinder -psofinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sofinder
          POSTGRES_USER: sofinder
          POSTGRES_PASSWORD: sofinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sofinder -d sofinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            dsn: mysql:host=127.0.0.1;port=3306;dbname=sofinder
          - driver: pgsql
            dsn: pgsql:host=127.0.0.1;port=5432;dbname=sofinder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pcntl, pdo_${{ matrix.driver }}
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit tests/PdoSharedStateDatabaseTest.php
        env:
          SOFINDER_STATE_DSN: ${{ matrix.dsn }}
          SOFINDER_STATE_USER: sofinder
          SOFINDER_STATE_PASSWORD: sofinder

  clamav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: docker run -d --name sofinder-clamav -p 3310:3310 clamav/clamav@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
      - name: Wait for ClamAV daemon
        run: |
          for attempt in {1..60}; do
            if php -r 'require "vendor/autoload.php"; exit((new SohoPHP\SoFinder\Security\ClamAvScanner("tcp://127.0.0.1:3310", 2.0))->check()->status === "ready" ? 0 : 1);'; then exit 0; fi
            sleep 5
          done
          docker logs sofinder-clamav
          exit 1
      - run: vendor/bin/phpunit tests/ClamAvLiveTest.php
        env:
          SOFINDER_CLAMAV_ENDPOINT: tcp://127.0.0.1:3310

  office-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: gd, zip
      - run: composer install --no-interaction --prefer-dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: vendor/bin/phpunit tests/DocumentPreviewTest.php --filter RealLibreOffice
        env:
          SOFINDER_LIBREOFFICE_BINARY: /usr/bin/libreoffice

  symfony-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            manifest: composer-6.4.json
          - php: '8.5'
            manifest: composer-7.4.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: cp ${{ matrix.manifest }} composer.json
        working-directory: examples/symfony
      - run: composer install --no-interaction --prefer-dist
        working-directory: examples/symfony
      - run: php bin/console cache:warmup --env=prod --no-interaction
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: php bin/console sofinder:image:capabilities --env=prod --json
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: php bin/console sofinder:security:audit --env=prod
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - name: Warm the single-provider S3 demo without optional provider 2 variables
        run: php bin/console cache:warmup --env=s3 --no-interaction
        working-directory: examples/symfony
        env:
          APP_ENV: s3
          APP_DEBUG: 0
          SOFINDER_PROVIDER_ENDPOINT: https://s3.example.invalid
          SOFINDER_PROVIDER_REGION: us-east-1
          SOFINDER_PROVIDER_BUCKET: sofinder-ci
          SOFINDER_PROVIDER_ACCESS_KEY: ci-access-key
          SOFINDER_PROVIDER_SECRET_KEY: ci-secret-key

  originality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan product source and distribution
        run: '! grep -RniE "CKFinder|CKSource" src frontend/src dist'
      - run: git diff --check
