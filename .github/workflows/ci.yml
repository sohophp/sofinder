name: CI

env:
  PHP_BIN: php

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4.*', '7.4.*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: ./scripts/composer.sh validate --strict
      - run: |
          ./scripts/composer.sh require --no-update \
            symfony/config:${{ matrix.symfony }} symfony/console:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} symfony/event-dispatcher:${{ matrix.symfony }} \
            symfony/filesystem:${{ matrix.symfony }} symfony/http-foundation:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }} symfony/routing:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }} symfony/security-csrf:${{ matrix.symfony }}
          ./scripts/composer.sh update --no-interaction --prefer-dist
      - run: ./scripts/php-bin.sh vendor/bin/phpunit --display-deprecations --fail-on-deprecation
      - run: ./scripts/composer.sh audit

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: gd
      - run: |
          ./scripts/composer.sh require --no-update \
            symfony/config:6.4.* symfony/console:6.4.* \
            symfony/dependency-injection:6.4.* symfony/event-dispatcher:6.4.* \
            symfony/filesystem:6.4.* symfony/http-foundation:6.4.* \
            symfony/http-kernel:6.4.* symfony/routing:6.4.* \
            symfony/security-core:6.4.* symfony/security-csrf:6.4.*
          ./scripts/composer.sh update --prefer-lowest --prefer-dist --no-interaction
      - run: ./scripts/php-bin.sh vendor/bin/phpunit --display-deprecations --fail-on-deprecation

  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: gd, imagick
      - run: cp composer.json composer.latest.json
      - run: COMPOSER=composer.latest.json ./scripts/composer.sh config --unset platform.php
      - run: >-
          COMPOSER=composer.latest.json ./scripts/composer.sh require --no-update
          symfony/config:7.4.* symfony/console:7.4.*
          symfony/dependency-injection:7.4.* symfony/event-dispatcher:7.4.*
          symfony/filesystem:7.4.* symfony/http-foundation:7.4.*
          symfony/http-kernel:7.4.* symfony/routing:7.4.*
          symfony/security-core:7.4.* symfony/security-csrf:7.4.*
      - run: COMPOSER=composer.latest.json ./scripts/composer.sh update --no-interaction --prefer-dist
      - run: ./scripts/php-bin.sh vendor/bin/phpunit --display-deprecations --fail-on-deprecation
      - run: COMPOSER=composer.latest.json ./scripts/composer.sh audit

  package-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: ./scripts/composer.sh validate --strict
      - run: ../../scripts/composer.sh validate --strict
        working-directory: packages/sofinder-core
      - run: ../../scripts/composer.sh validate --strict
        working-directory: packages/sofinder-http
      - run: ../../scripts/composer.sh validate --strict
        working-directory: packages/sofinder-psr15
      - run: ../../scripts/composer.sh validate --strict
        working-directory: packages/sofinder-symfony
      - run: diff -qr dist packages/sofinder-symfony/dist
      - run: ./scripts/php-bin.sh scripts/check-framework-release-gate.php
      - run: bash scripts/check-framework-release-gate-fixtures.sh
      - run: bash scripts/check-observation-evidence-fixtures.sh
      - run: bash scripts/check-package-install.sh
      - run: |
          release_output=$(mktemp -d var/release-archives.XXXXXX)
          bash scripts/build-release-archives.sh 1.0.0-rc.1 WORKTREE "$release_output"
      - run: |
          split_output=$(mktemp -d var/package-splits.XXXXXX)
          bash scripts/prepare-package-splits.sh 1.0.0-rc.1 "$GITHUB_SHA" "$split_output"
          (cd "$split_output" && sha256sum -c SPLIT_SHA256SUMS)
          verify_output=$(mktemp -d var/package-split-verify.XXXXXX)
          while IFS=$'\t' read -r _package _repository commit tag bundle; do
            checkout="$verify_output/${_package#sohophp/}"
            git clone --quiet --branch package-release-main "$split_output/$bundle" "$checkout"
            test "$(git -C "$checkout" rev-parse "refs/tags/$tag^{commit}")" = "$commit"
          done < "$split_output/SPLIT_MANIFEST.tsv"
          bash scripts/check-package-split-publication.sh "$split_output"
      - run: ./scripts/php-bin.sh vendor/bin/phpunit tests/FrameworkBoundaryTest.php tests/EndpointCatalogTest.php tests/SharedActionCoverageTest.php tests/Psr15BridgeTest.php tests/PsrImplementationTest.php tests/RouteRegistrarTest.php tests/SharedEndpointActionTest.php tests/SharedMutationActionTest.php tests/SharedUploadActionTest.php tests/SharedQuickUploadActionTest.php tests/SharedMetadataActionTest.php tests/SharedContentReadActionTest.php tests/SharedChunkActionTest.php tests/SharedChunkUploadActionTest.php tests/SharedImageInfoActionTest.php tests/SharedImageMutationActionTest.php tests/SharedArchiveActionTest.php tests/SharedAssetSessionActionTest.php tests/SharedFrontendAssetActionTest.php tests/SharedAssetSearchActionTest.php tests/SharedAssetUsageActionTest.php tests/SharedAssetActionTest.php tests/SharedRoutedActionTest.php tests/SharedStreamActionTest.php tests/SharedDerivedStreamActionTest.php tests/SharedMetricsActionTest.php

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm check:size
        working-directory: frontend
      - run: pnpm test:unit
        working-directory: frontend
      - run: git diff --exit-code -- dist
      - run: pnpm exec playwright install --with-deps
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend

  package-install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            preference: lowest
          - php: '8.5'
            preference: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash scripts/check-package-install.sh
        env:
          SOFINDER_COMPOSER_PREFERENCE: ${{ matrix.preference }}

  psr15-hosts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: bash scripts/check-psr15-hosts.sh

  laravel-bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '10'
          - php: '8.5'
            laravel: '12'
            testbench: '10'
          - php: '8.3'
            laravel: '13'
            testbench: '11'
          - php: '8.5'
            laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: cp composer.json composer.laravel.json
      - if: matrix.laravel == '13'
        run: COMPOSER=composer.laravel.json ./scripts/composer.sh config --unset platform.php
      - run: >-
          COMPOSER=composer.laravel.json ./scripts/composer.sh require --no-update
          illuminate/auth:${{ matrix.laravel }}.*
          illuminate/console:${{ matrix.laravel }}.*
          illuminate/http:${{ matrix.laravel }}.*
          illuminate/routing:${{ matrix.laravel }}.*
          illuminate/session:${{ matrix.laravel }}.*
          illuminate/support:${{ matrix.laravel }}.*
          orchestra/testbench:${{ matrix.testbench }}.*
      - run: COMPOSER=composer.laravel.json ./scripts/composer.sh update --no-interaction --prefer-dist
      - run: ./scripts/php-bin.sh vendor/bin/phpunit tests/LaravelBridgeTest.php tests/LaravelApplicationTest.php
      - run: COMPOSER=composer.laravel.json ./scripts/composer.sh audit

  s3-adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: ../../scripts/composer.sh config repositories.sofinder-core '{"type":"path","url":"../sofinder-core","options":{"versions":{"sohophp/sofinder-core":"dev-main"}}}'
        working-directory: packages/sofinder-s3
      - run: ../../scripts/composer.sh install --no-interaction --prefer-dist
        working-directory: packages/sofinder-s3
      - run: |
          ../../scripts/php-bin.sh -r 'require "vendor/autoload.php"; exit(class_exists("SohoPHP\\SoFinderS3\\S3StorageAdapter") && !class_exists("Symfony\\Component\\HttpFoundation\\Request") ? 0 : 1);'
        working-directory: packages/sofinder-s3
      - run: docker run -d --name sofinder-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0 server /data
      - run: for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; exit 1
      - run: ../../scripts/php-bin.sh vendor/bin/phpunit
        working-directory: packages/sofinder-s3
        env:
          SOFINDER_S3_ENDPOINT: http://127.0.0.1:9000
          SOFINDER_S3_BUCKET: sofinder-test
          SOFINDER_S3_ACCESS_KEY: minioadmin
          SOFINDER_S3_SECRET_KEY: minioadmin

  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          extensions: gd, imagick, pcntl, pdo_sqlite, redis
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: ./scripts/composer.sh phpstan
      - run: ./scripts/php-bin.sh vendor/bin/phpunit --coverage-clover var/coverage.xml
      - run: >-
          ./scripts/php-bin.sh scripts/check-coverage.php var/coverage.xml 72
          packages/sofinder-core/src/Preview/DocumentPreviewJobManager.php:85
          packages/sofinder-core/src/Preview/DocumentPreviewManager.php:85
          packages/sofinder-core/src/Security/MalwareScanStatusStore.php:85
          packages/sofinder-core/src/Security/SharedMalwareScanStatusStore.php:85
          packages/sofinder-symfony/src/Http/AssetController.php:85
          packages/sofinder-symfony/src/Asset/AssetReferenceFactory.php:85
          packages/sofinder-core/src/Asset/AssetOperationPublisher.php:85
          packages/sofinder-core/src/Asset/JsonAssetCatalog.php:85
          packages/sofinder-core/src/Asset/SharedAssetCatalog.php:85
          packages/sofinder-symfony/src/Http/AssetApiController.php:85
          packages/sofinder-core/src/Event/AssetOperationEvent.php:85
          packages/sofinder-symfony/src/Symfony/AssetCatalogSubscriber.php:85
          packages/sofinder-symfony/src/Symfony/VersionedOperationSubscriber.php:85
          packages/sofinder-symfony/src/Symfony/DefaultWorkspaceResolver.php:85
          packages/sofinder-core/src/Workspace/WorkspaceProvider.php:85
          packages/sofinder-core/src/Plugin/PluginRegistry.php:85
          packages/sofinder-symfony/src/Plugin/PluginContractValidator.php:85

  pdo-state:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sofinder
          MYSQL_USER: sofinder
          MYSQL_PASSWORD: sofinder
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usofinder -psofinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sofinder
          POSTGRES_USER: sofinder
          POSTGRES_PASSWORD: sofinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sofinder -d sofinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            dsn: mysql:host=127.0.0.1;port=3306;dbname=sofinder
          - driver: pgsql
            dsn: pgsql:host=127.0.0.1;port=5432;dbname=sofinder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pcntl, pdo_${{ matrix.driver }}
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: ./scripts/php-bin.sh vendor/bin/phpunit tests/PdoSharedStateDatabaseTest.php
        env:
          SOFINDER_STATE_DSN: ${{ matrix.dsn }}
          SOFINDER_STATE_USER: sofinder
          SOFINDER_STATE_PASSWORD: sofinder

  clamav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: docker run -d --name sofinder-clamav -p 3310:3310 clamav/clamav@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
      - name: Wait for ClamAV daemon
        run: |
          for attempt in {1..60}; do
            if ./scripts/php-bin.sh -r 'require "vendor/autoload.php"; exit((new SohoPHP\SoFinder\Security\ClamAvScanner("tcp://127.0.0.1:3310", 2.0))->check()->status === "ready" ? 0 : 1);'; then exit 0; fi
            sleep 5
          done
          docker logs sofinder-clamav
          exit 1
      - run: ./scripts/php-bin.sh vendor/bin/phpunit tests/ClamAvLiveTest.php
        env:
          SOFINDER_CLAMAV_ENDPOINT: tcp://127.0.0.1:3310

  office-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: gd, zip
      - run: ./scripts/composer.sh install --no-interaction --prefer-dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - run: ./scripts/php-bin.sh vendor/bin/phpunit tests/DocumentPreviewTest.php --filter RealLibreOffice
        env:
          SOFINDER_LIBREOFFICE_BINARY: /usr/bin/libreoffice

  symfony-example:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            manifest: composer-6.4.json
            symfony: '6.4.*'
          - php: '8.5'
            manifest: composer-7.4.json
            symfony: '7.4.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, imagick
      - run: cp ${{ matrix.manifest }} composer.json
        working-directory: examples/symfony
      - run: ../../scripts/composer.sh install --no-interaction --prefer-dist
        working-directory: examples/symfony
      - run: ../../scripts/php-bin.sh bin/console cache:warmup --env=prod --no-interaction
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: bash scripts/check-symfony-example-http.sh
      - run: ../../scripts/composer.sh require symfony/messenger:${{ matrix.symfony }} --with-all-dependencies --no-interaction --prefer-dist
        working-directory: examples/symfony
      - run: ../../scripts/php-bin.sh bin/console cache:warmup --env=messenger --no-interaction
        working-directory: examples/symfony
        env: { APP_ENV: messenger, APP_DEBUG: 0 }
      - run: ../../scripts/php-bin.sh bin/console sofinder:maintenance:status --env=messenger --json
        working-directory: examples/symfony
        env: { APP_ENV: messenger, APP_DEBUG: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test --config playwright.symfony.config.ts
        working-directory: frontend
      - name: Verify the reference inspector is available only in the dev demo
        run: |
          ../../scripts/php-bin.sh bin/console debug:router --env=dev | grep -F '/integrations/plugin-inspector'
          ../../scripts/php-bin.sh bin/console debug:container --tag=sofinder.plugin --env=dev | grep -F 'App\Plugin\FileInspectorPlugin'
          if ../../scripts/php-bin.sh bin/console debug:router --env=prod | grep -F '/integrations/plugin-inspector'; then exit 1; fi
          if ../../scripts/php-bin.sh bin/console debug:container --tag=sofinder.plugin --env=prod | grep -F 'App\Plugin\FileInspectorPlugin'; then exit 1; fi
        working-directory: examples/symfony
      - run: ../../scripts/php-bin.sh bin/console sofinder:image:capabilities --env=prod --json
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - run: ../../scripts/php-bin.sh bin/console sofinder:security:audit --env=prod
        working-directory: examples/symfony
        env: { APP_ENV: prod, APP_DEBUG: 0 }
      - name: Warm the single-provider S3 demo without optional provider 2 variables
        run: ../../scripts/php-bin.sh bin/console cache:warmup --env=s3 --no-interaction
        working-directory: examples/symfony
        env:
          APP_ENV: s3
          APP_DEBUG: 0
          SOFINDER_PROVIDER_ENDPOINT: https://s3.example.invalid
          SOFINDER_PROVIDER_REGION: us-east-1
          SOFINDER_PROVIDER_BUCKET: sofinder-ci
          SOFINDER_PROVIDER_ACCESS_KEY: ci-access-key
          SOFINDER_PROVIDER_SECRET_KEY: ci-secret-key

  originality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan product source and distribution
        run: '! grep -RniE "CKFinder|CKSource" src frontend/src dist'
      - run: git diff --check
