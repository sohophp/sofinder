sofinder:
  resource: '@SoFinderBundle/Resources/config/routes.yaml'
  prefix: /sofinder

example.integrations:
  path: '/integrations'
  controller: 'App\Controller\IntegrationDemoController'
  methods: [GET]

example.plugin.inspector:
  path: '/integrations/plugin-inspector'
  controller: 'App\Controller\PluginInspectorController'
  methods: [GET]

example.file.output:
  path: '/host-files/{resource}/{name}'
  controller: 'App\Controller\HostFileController::output'
  methods: [GET]
  requirements:
    resource: '[A-Za-z][A-Za-z0-9_-]*'
    name: '[^/]+'
