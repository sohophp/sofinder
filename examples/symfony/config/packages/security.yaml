security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: plaintext
  providers:
    demo_users:
      memory:
        users:
          demo: { password: demo, roles: [ROLE_USER, ROLE_ADMIN] }
          reader: { password: reader, roles: [ROLE_USER] }
  firewalls:
    main:
      lazy: true
      provider: demo_users
      http_basic: ~
  access_control:
    - { path: ^/sofinder/live$, roles: PUBLIC_ACCESS }
    - { path: ^/sofinder/signed/, roles: PUBLIC_ACCESS }
    - { path: ^/sofinder, roles: ROLE_USER }
    - { path: ^/integrations, roles: ROLE_USER }
    - { path: ^/host-files, roles: ROLE_USER }
