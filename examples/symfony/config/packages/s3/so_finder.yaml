so_finder:
  resources:
    Files:
      adapter: local
      root: "%kernel.project_dir%/var/storage"
      public_url: "/uploads"
      delivery_mode: public
      quota: 1073741824
      allowed_extensions: [txt, md, csv, tsv, rtf, pdf, doc, docx, odt, xls, xlsx, ods, ppt, pptx, odp, jpg, jpeg, png, gif, webp, avif, bmp, ico, heic, heif, tif, tiff, zip, 7z, rar, tar, gz, tgz, mp3, wav, ogg, m4a, flac, mp4, webm, mov]
      roles: [ROLE_USER]
    Images:
      adapter: local
      root: "%kernel.project_dir%/var/images"
      public_url: ""
      delivery_mode: proxy
      quota: 536870912
      allowed_extensions: [jpg, jpeg, png, gif, webp, svg]
      roles: [ROLE_USER]
    S3Files:
      adapter: s3
      root: "%env(SOFINDER_PROVIDER_PREFIX)%"
      public_url: "%env(SOFINDER_PROVIDER_PUBLIC_URL)%"
      delivery_mode: proxy
      entry_url:
        route: example.file.output
        # Keep same-origin picker results scheme-relative to the application.
        # Set this to true only when consumers explicitly require absolute URLs.
        absolute: false
        parameters:
          resource: "{resource}"
          name: "{name}"
          path: "{path}"
          disposition: inline
      allowed_extensions: [txt, md, csv, tsv, rtf, pdf, doc, docx, odt, xls, xlsx, ods, ppt, pptx, odp, jpg, jpeg, png, gif, webp, svg, avif, bmp, ico, heic, heif, tif, tiff, zip, 7z, rar, tar, gz, tgz, mp3, wav, ogg, m4a, flac, mp4, webm, mov]
      roles: [ROLE_USER]
      options:
        bucket: "%env(SOFINDER_PROVIDER_BUCKET)%"
        region: "%env(SOFINDER_PROVIDER_REGION)%"
        endpoint: "%env(SOFINDER_PROVIDER_ENDPOINT)%"
        use_path_style_endpoint: "%env(bool:SOFINDER_PROVIDER_USE_PATH_STYLE_ENDPOINT)%"
        access_key_id: "%env(SOFINDER_PROVIDER_ACCESS_KEY)%"
        secret_access_key: "%env(SOFINDER_PROVIDER_SECRET_KEY)%"
        session_token: "%env(SOFINDER_PROVIDER_SESSION_TOKEN)%"
