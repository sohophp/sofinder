so_finder:
  image_processing:
    driver: auto
    # An explicit font wins; otherwise SoFinder finds a system CJK font or caches Noto Sans CJK.
    watermark_font: null
    watermark_font_auto_download: true
  signed_urls:
    enabled: true
    secret: '%kernel.secret%'
    default_ttl_seconds: 300
    max_ttl_seconds: 3600
  # Enabled in the demo so the editor integrations visibly exercise stable IDs,
  # alternative text and responsive image delivery. Library defaults stay off.
  asset_catalog:
    enabled: true
    register_existing: lazy
    alt_locales: [en, zh-cn, zh-tw]
  image_variants:
    enabled: true
    widths: [320, 640, 960, 1280, 1920]
    formats: [original, webp]
    quality: 82
    mode: on_demand
    max_variants_per_asset: 10
    cache_ttl_seconds: 2592000
  malware_scanning:
    enabled: '%env(bool:SOFINDER_CLAMAV_ENABLED)%'
    endpoint: 'tcp://127.0.0.1:3310'
    timeout_seconds: 5
    status_roles: [ROLE_ADMIN]
  resources:
    Files:
      adapter: local
      root: '%kernel.project_dir%/var/storage'
      public_url: '/uploads'
      delivery_mode: public
      quota: 1073741824 # 1 GiB; keeps storage usage visible in the demo.
      # Common documents, Office/OpenDocument files, images, archives and media.
      # Active/executable formats remain denied by the bundle defaults.
      allowed_extensions: [txt, md, csv, tsv, rtf, pdf, doc, docx, odt, xls, xlsx, ods, ppt, pptx, odp, jpg, jpeg, png, gif, webp, avif, bmp, ico, heic, heif, tif, tiff, zip, 7z, rar, tar, gz, tgz, mp3, wav, ogg, m4a, flac, mp4, webm, mov]
      roles: [ROLE_USER]
      operation_roles:
        upload: [ROLE_ADMIN]
    Private:
      adapter: local
      root: '%kernel.project_dir%/var/private-storage'
      public_url: ''
      delivery_mode: proxy
      quota: 536870912 # 512 MiB
      allowed_extensions: [txt, md, csv, tsv, rtf, pdf, doc, docx, odt, xls, xlsx, ods, ppt, pptx, odp, jpg, jpeg, png, gif, webp, avif, bmp, ico, heic, heif, tif, tiff, zip, 7z, rar, tar, gz, tgz, mp3, wav, ogg, m4a, flac, mp4, webm, mov]
      roles: [ROLE_USER]
  document_preview:
    pdf: true
    office: true
    office_binary: '/usr/bin/libreoffice'
    timeout_seconds: 60
    max_bytes: 52428800
  uploads:
    naming:
      lowercase_extensions: true
  ui:
    mode: auto
    header: true
    logo: true
    search: true
    language_switcher: true
    view_switcher: true
    upload_conflict_strategy: ask # ask, rename, overwrite or skip
